name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Copy Monaco editor assets
        run: |
          mkdir -p public/monaco/min
          cp -r node_modules/monaco-editor/min/vs public/monaco/min/vs

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
